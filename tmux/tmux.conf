# ============================
# KEYBINDINGS REFERENCE
# ============================
#
# PREFIX: Ctrl+a
#
# Session/Config:
#   prefix + r          - Reload tmux config
#   Ctrl+s              - Toggle nested session mode
#
# Windows:
#   prefix + c          - Create new window
#   prefix + ,          - Rename window
#   Alt + h/l           - Switch windows (no prefix)
#   Alt + Left/Right    - Switch windows (alternative)
#
# Panes:
#   prefix + v          - Split vertical (right)
#   prefix + h          - Split horizontal (down)
#   Ctrl + h/j/k/l      - Navigate panes/vim splits seamlessly (vim-tmux-navigator)
#   Ctrl + \            - Navigate to previous pane (vim-tmux-navigator)
#   prefix + arrows     - Navigate panes (alternative)
#   prefix + Ctrl-l     - Clear screen (since Ctrl-l is used for navigation)
#
# Copy Mode (vim-like):
#   prefix + k          - Enter copy mode / scroll back
#   prefix + [          - Enter copy mode (traditional)
#   prefix + Escape     - Enter copy mode (alternative)
#
#   Inside copy mode:
#     hjkl              - Navigate (vim motions)
#     v                 - Start selection
#     Ctrl+v            - Rectangle selection
#     y                 - Yank to system clipboard
#     /                 - Search forward
#     ?                 - Search backward
#     Escape / q        - Exit copy mode
#
# Plugins:
#   prefix + Space      - tmux-thumbs (quick copy text/URLs/paths)
#   prefix + j          - tmux-jump (jump to text in pane)
#   prefix + I          - Install/update plugins (TPM)
#   prefix + U          - Update plugins (TPM)
#
# ============================

# Remove escape delay
set -sg escape-time 0

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Window split keys
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits (vim-tmux-navigator)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Restore clear screen keybinding (Ctrl-l is now used for navigation)
bind C-l send-keys 'C-l'

# vim-tmux-navigator support in copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Backup: also allow arrow keys with prefix
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# Window navigation (vim-style: Alt + h/l)
bind -n M-h previous-window
bind -n M-l next-window
# Backup: also allow arrows
bind -n M-Left previous-window
bind -n M-Right next-window

# Vi-mode for copy mode
setw -g mode-keys vi

# Enter copy mode with prefix + k (vim-like up motion)
bind k copy-mode

# Also allow traditional bindings
bind Escape copy-mode
bind [ copy-mode

# Vi-like copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi Escape send-keys -X cancel

# Vi-like navigation in copy mode (hjkl, etc. work by default with mode-keys vi)

# Mouse off - keyboard only
set -g mouse off

# Toggle nested session key bindings
bind -T root C-s  \
    set prefix None \;\
    set key-table off \;\
    set status off \;\
    set status-position top \;\
    refresh-client -S \;\

bind -T off C-s \
    set -u prefix \;\
    set -u key-table \;\
    set status on \;\
    set -u status-position \;\
    refresh-client -S

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Terminal settings
set-option -sa terminal-overrides ",xterm*:Tc"
set -g set-titles on
set -g set-titles-string '#H ❐ #S'

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# History
set -g history-limit 10000

# Window naming
set -g allow-rename off
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"

# Status bar and window customization
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left "#[fg=#8FBCBB,bg=#2E3440] « #S » "
set -g status-right ""
set -g status-justify left
set -g window-status-current-format "#[fg=#88C0D0,bold,bg=#2E3440] #I #[fg=#ECEFF4,bold]#{?window_name,#W,#{pane_current_command}} "
set -g window-status-format "#[fg=#D8DEE9,bg=#2E3440] #I #{?window_name,#W,#{pane_current_command}} "

# Set background for panes (Gruvbox theme) - active pane is brighter
set -g window-style "bg=#282828"
set -g window-active-style "bg=#3c3836"

# Pane borders - highlight active pane
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fe8019,bold"

# Pane border status line
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#282828]#[bg=#fe8019],#[fg=#ebdbb2]#[bg=#282828]} #{pane_index} #{pane_current_command} "

# ============================
# Plugins
# ============================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'schasse/tmux-jump'

# Plugin settings
set -g @thumbs-key Space
set -g @jump-key 'j'

# Copy to system clipboard
set -g @thumbs-command 'echo -n {} | xclip -selection clipboard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
